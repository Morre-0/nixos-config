[colors]
background = #282828
foreground = #dfddc8
primary = #a9b665
accent = #d8a657
alert = #ea6962
disabled = #504945

[bar/main]
width = 100%
height = 24pt
radius = 0
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0px
padding-left = 2
padding-right = 2
module-margin = 1

separator = " │ "
separator-foreground = ${colors.disabled}

# Используем твой нативный JetBrains Mono для всего текста и цифр
font-0 = "JetBrainsMono Nerd Font:style=Regular:size=11;3"

modules-left = bspwm
modules-center = date
modules-right = xkeyboard backlight pulseaudio battery network

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/bspwm]
type = internal/bspwm
# Строгие текстовые номера рабочих столов (просто цифры)
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-default = 0

format = <label-state>

label-focused = [%name%]
label-focused-background = ${colors.disabled}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.accent}
label-occupied-padding = 2

label-urgent = ERR:%name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
format = <label-layout>
format-prefix = "LANG: "
format-prefix-foreground = ${colors.accent}
label-layout = %layout%
label-layout-transform = uppercase

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
format = <label>
format-prefix = "BRIGHT: "
format-prefix-foreground = ${colors.accent}
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "VOL: %percentage%%"
label-volume-foreground = ${colors.primary}
label-muted = "VOL: MUTED"
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BATT
adapter = ACAD
poll-interval = 2

format-charging = <label-charging>
label-charging = "CHRG: %percentage%%"
label-charging-foreground = ${colors.primary}

format-discharging = <label-discharging>
label-discharging = "BAT: %percentage%%"
label-discharging-foreground = ${colors.foreground}

format-low = <label-low>
label-low = "LOW BAT: %percentage%%"
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date = "%H:%M:%S"
date-alt = "%A, %d %B %Y"
label = %date%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface-type = wireless
interval = 3
label-connected = "WIFI: %essid%"
label-connected-foreground = ${colors.primary}
label-disconnected = "WIFI: DOWN"
label-disconnected-foreground = ${colors.disabled}

