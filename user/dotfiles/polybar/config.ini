[colors]
bg = #282828
fg = #dfddc8
border-bg = #1d2021
primary = #a9b665
accent = #d8a657
alert = #ea6962
disabled = #504945

# СБОРКА МОДУЛЬНЫХ КАПСУЛ (ЛЕВАЯ, ЦЕНТРАЛЬНАЯ, ПРАВАЯ)
[bar/base]
monitor = 
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true
height = 24pt
radius = 8
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2pt
padding = 2
module-margin = 1
font-0 = "SpaceMono Nerd Font:style=Regular:size=10;3"
font-1 = "Symbols Nerd Font:style=Regular:size=11;3"
font-2 = "JetBrainsMono Nerd Font:style=Regular:size=11;3"

enable-ipc = true

[bar/left]
inherit = bar/base
width = 15%
offset-x = 1%
offset-y = 6pt
modules-left = bspwm

[bar/center]
inherit = bar/base
width = 12%
offset-x = 44%
offset-y = 6pt
modules-center = date

[bar/right]
inherit = bar/base
width = 25%
offset-x = 74%
offset-y = 6pt
modules-right = xkeyboard backlight pulseaudio battery network

# НАСТРОЙКА МОДУЛЕЙ С АВТОРСКИМИ ПРЕФИКСАМИ И ИКОНКАМИ
[module/bspwm]
type = internal/bspwm
format = <label-state>
label-focused = 
label-focused-foreground = ${colors.primary}
label-focused-padding = 1
label-occupied = 
label-occupied-foreground = ${colors.accent}
label-occupied-padding = 1
label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 1
date = " %H:%M:%S"
date-alt = " %d.%m.%Y"
label = %date%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
format = <label-layout>
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label-layout = %layout%

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = " %percentage%%"
label-volume-foreground = ${colors.primary}
label-muted = " muted"
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BATT
adapter = ACAD
full-at = 99
low-at = 15
poll-interval = 2
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-foreground = ${colors.primary}
label-charging = %percentage%%
format-discharging = <label-discharging>
format-discharging-prefix = " "
label-discharging = %percentage%%

[module/network]
type = internal/network
interface-type = wireless
label-connected = " %essid%"
label-connected-foreground = ${colors.primary}
label-disconnected = " down"
label-disconnected-foreground = ${colors.disabled}

