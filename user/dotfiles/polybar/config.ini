[colors]
background = #282828
foreground = #dfddc8
primary = #a9b665
accent = #d8a657
alert = #ea6962
disabled = #504945

[bar/main]
# ПАРЯЩИЙ СТИЛЬ: Ширина 98%, отступы по краям и скругление углов 10px
width = 98%
height = 24pt
offset-x = 1%
offset-y = 8pt
radius = 10
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 2pt
border-color = #282828

line-size = 2pt
padding-left = 4
padding-right = 4
module-margin = 1

separator = " · "
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"

modules-left = bspwm
modules-center = date
modules-right = xkeyboard backlight pulseaudio battery network

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/bspwm]
type = internal/bspwm
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5

format = <label-state>

label-focused = %name%
label-focused-foreground = #282828
# Плотное выделение активного стола Gruvbox-капсулой
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.accent}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
format = <label-layout>
label-layout = %layout%
label-layout-transform = uppercase
label-layout-foreground = ${colors.accent}

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
format = <label>
label = scr %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = vol %percentage%%
label-volume-foreground = ${colors.primary}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BATT
adapter = ACAD
poll-interval = 2

format-charging = <label-charging>
label-charging = +%percentage%%
label-charging-foreground = ${colors.primary}

format-discharging = <label-discharging>
label-discharging = %percentage%%

format-low = <label-low>
label-low = low %percentage%%
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date = "%H:%M:%S"
date-alt = "%d.%m.%Y"
label = %date%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface-type = wireless
interval = 3
label-connected = %essid%
label-connected-foreground = ${colors.primary}
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}
